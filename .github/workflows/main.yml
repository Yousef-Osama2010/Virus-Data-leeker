name: Build Virus App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # تشغيل الأمر بالظبط زي ما طلبت، لكن بصيغة Linux
    - name: Build with Gradle
      run: |
        export JAVA_HOME=$JAVA_HOME
        export ANDROID_HOME=$ANDROID_HOME
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        # الانتقال لمجلد المشروع (إذا كان في مجلد فرعي)
        # إذا المشروع في الجذر اترك السطر التالي كما هو
        # cd path/to/your/project/folder
        
        ./gradlew :app:assembleUniversalFossDebug \
          --no-daemon \
          --max-workers=1 \
          '-Pkotlin.compiler.execution.strategy=in-process'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-universal-foss-debug.apk
        path: app/build/outputs/apk/universalFossDebug/app-universalFossDebug.apk
